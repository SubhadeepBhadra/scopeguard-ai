version: '3.8'

services:
  scopeguard-ai:
    build: .
    container_name: scopeguard_ai_app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:////app/scopeguard.db
    volumes:
      - scopeguard_data:/app
    restart: unless-stopped

volumes:
  scopeguard_data:
